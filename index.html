<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Книга для эфира</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:#0a0604;overflow:hidden;font-family:Lora,Georgia,serif}
#wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
#stage{position:relative;width:540px;height:960px;flex:none;overflow:hidden;--f:1;background:#120a06}
#scene{position:absolute;left:0;top:0;width:540px;display:block}


/* таблички: одна картинка рамки, внутри чистый пергамент */
/* таблички висят на стене: текст рисуется в холсте в высоком разрешении, с перспективой стены, и впитывается в пергамент */
.plaque{position:absolute;z-index:10;mix-blend-mode:multiply;display:block}
#chatPlaque{left:73px;top:42px;width:196px;height:81px}
#giftsPlaque{left:338px;top:53px;width:137px;height:60px}
/* отсвет свечи на дальней табличке, вспыхивает при подарке */
#giftLight{position:absolute;left:322px;top:40px;width:170px;height:88px;z-index:9;pointer-events:none;mix-blend-mode:screen;
  background:radial-gradient(ellipse at 45% 55%,rgba(255,196,120,.42),rgba(255,170,90,.18) 55%,transparent 72%);opacity:calc(.8 + .2*var(--f))}
#giftLight.flash{animation:gflash 1.2s ease-out}
@keyframes gflash{0%{filter:brightness(1)}25%{filter:brightness(2.6)}100%{filter:brightness(1)}}

#bookwrap{position:absolute;z-index:6}
.bookimg{position:absolute;left:0;top:0;width:100%;height:100%;display:block}
.stk{display:none;position:absolute;height:3px;transition:height 1.4s ease-in-out;
  background:repeating-linear-gradient(180deg,#f4dca6 0 1.3px,#b98a4c 1.3px 2.2px,#e8cb8e 2.2px 3.2px);
  box-shadow:inset 0 -4px 5px rgba(70,35,8,.55)}
.spreadbox{position:absolute;inset:0}
.pg{position:absolute;width:var(--lw);height:var(--lh)}
.pg>canvas{position:absolute;left:0;top:0;width:100%;height:100%;display:block}
.text{position:absolute;width:var(--pw);height:var(--ph)}
.pg.R .text{left:var(--txR);top:var(--tyy)}
.pg.L .text{left:var(--txL);top:var(--tyy)}
.line{position:absolute;left:0;width:100%;height:19.5px;border-radius:3px;color:transparent}
.hl{position:absolute;left:0;top:0;width:100%;height:100%;pointer-events:none}
.line.on{background:linear-gradient(90deg,rgba(255,196,90,0),rgba(255,196,90,.34) 6%,rgba(255,196,90,.34) 94%,rgba(255,196,90,0))}
#gl{position:absolute;pointer-events:none;display:block}

#candle{position:absolute;left:0;top:0;width:0;height:0;z-index:8}
#glow{position:absolute;left:-162px;top:-80px;width:420px;height:420px;pointer-events:none;mix-blend-mode:screen;
  background:radial-gradient(circle,rgba(255,170,70,.55),rgba(255,140,40,.18) 40%,transparent 65%);
  opacity:calc(.5 + .5*var(--f))}
#flamecv{position:absolute;left:18px;top:46px;width:60px;height:120px;pointer-events:none}
#quill{position:absolute;left:468px;top:121px;width:64px;height:110px;z-index:9;transform-origin:6px 107px;transform:rotate(-6deg);
  clip-path:inset(0 0 9px 0);filter:drop-shadow(5px 6px 4px rgba(20,8,0,.5))}

#light{position:absolute;inset:0;z-index:20;pointer-events:none;mix-blend-mode:screen;
  background:radial-gradient(circle at 9% 14%,rgba(255,170,80,.22),transparent 45%);
  opacity:calc(.55 + .45*var(--f))}
#vig{position:absolute;inset:0;z-index:25;pointer-events:none;background:radial-gradient(ellipse at 50% 42%,transparent 60%,rgba(0,0,0,.32) 100%)}

/* лупа (по умолчанию выключена, включается ссылкой ?lens=1) */
.lens{position:absolute;left:0;top:0;width:227px;height:196px;z-index:30;pointer-events:none;transition:opacity .4s;display:none;
  filter:drop-shadow(0 8px 8px rgba(0,0,0,.5))}
body.haslens .lens{display:block}
.glass{position:absolute;left:17px;top:14px;width:112px;height:112px;border-radius:50%;overflow:hidden;z-index:1;background:#e6c88a}
.glass::after{content:"";position:absolute;inset:0;border-radius:50%;pointer-events:none;
  background:radial-gradient(circle at 30% 25%,rgba(255,255,255,.3),transparent 40%);box-shadow:inset 0 0 14px rgba(0,0,0,.4)}
.arm{position:absolute;left:73px;top:70px;width:0;height:0;z-index:2}
.ring{position:absolute;left:-73px;top:-70px;width:227px;height:196px;transform-origin:73px 70px;transform:rotate(-38deg);display:block}
.fist{position:absolute;left:104px;top:0;width:0;height:0;transform:rotate(-90deg)}
.hin{position:absolute;transform-origin:0 0}
.hin>img{position:absolute;left:0;top:0;display:block}
.ext{position:absolute;transform-origin:0 0}

/* руки */
.handfx{position:absolute;left:0;top:0;width:0;height:0;z-index:31;pointer-events:none;display:none}
.hand{position:absolute;left:0;top:0;width:0;height:0}
/* шов у корешка: мягкая складка поверх обеих страниц */
#spine{position:absolute;pointer-events:none;
  background:linear-gradient(90deg,rgba(60,26,4,0),rgba(60,26,4,.10) 30%,rgba(45,18,2,.38) 46%,rgba(30,10,0,.62) 50%,rgba(45,18,2,.38) 54%,rgba(60,26,4,.10) 70%,rgba(60,26,4,0));
  -webkit-mask-image:linear-gradient(180deg,transparent 0,#000 4%,#000 96%,transparent);mask-image:linear-gradient(180deg,transparent 0,#000 4%,#000 96%,transparent)}
#fsb{position:fixed;top:10px;right:10px;z-index:200;width:42px;height:42px;border-radius:10px;border:1px solid #8d6420;
  background:rgba(30,18,8,.65);color:#f1deb0;font:20px/1 Lora,Georgia,serif;display:flex;align-items:center;justify-content:center;transition:opacity .6s}
#fsb.idle{opacity:0}
body.fs #fsb{display:none}

#ctl{position:fixed;bottom:8px;left:50%;transform:translateX(-50%);display:flex;gap:8px;z-index:100}
#ctl button{font:14px Lora,Georgia,serif;color:#f1deb0;background:rgba(30,18,8,.75);border:1px solid #8d6420;border-radius:8px;padding:8px 14px}
body.clean #ctl{display:none}
</style>
</head>
<body>
<div id="wrap">
<div id="stage">
  <img id="scene" src="assets/scene.webp" alt="">

  <div id="giftLight"></div>
  <canvas class="plaque" id="chatPlaque"></canvas>
  <canvas class="plaque" id="giftsPlaque"></canvas>

  <div id="bookwrap">
    <div class="stk" id="stkL"></div>
    <div class="stk" id="stkR"></div>
    <div id="spread" class="spreadbox">
      <div class="pg L" id="pL"></div>
      <div class="pg R" id="pR"></div>
    </div>
    <canvas id="gl"></canvas>
  </div>

  <div id="candle">
    <div id="glow"></div>
    <canvas id="flamecv"></canvas>
  </div>

  <img id="quill" src="assets/quill.webp" alt="">

  <div class="lens" id="lens">
    <div class="glass" id="glass"></div>
    <div class="arm" id="arm">
      <img class="ring" src="assets/lens.webp" alt="">
      <div class="fist"><div class="hin" id="fistin"></div></div>
    </div>
  </div>

  <div id="light"></div>
  <div id="vig"></div>
</div>
</div>

<button id="fsb" aria-label="На весь экран">⛶</button>
<div id="ctl">
  <button id="bPrev">◀</button>
  <button id="bPlay">❚❚</button>
  <button id="bNext">▶</button>
  <button id="bGift">Подарок</button>
</div>

<script>
(function(){
/* ---------- геометрия ---------- */
var Q=1438/540;                            /* пикселей картины сцены на единицу сцены */
var BX=0, BY=290, BW=540, BH=460;
var PW=192, PH=330, X0L=66, X0R=284, Y0=40;
var LX0=718/Q, LY0=817/Q-BY, LW=610/Q, LHT=1057/Q; /* лист = нарисованная страница, вырезанная из картины */
var TW=184, TLL=4, TLR=4, TT=4, LH=17.5, PERP=17, FS=12.5;
/* рельеф страниц, снятый с картины: верхний и нижний край каждой страницы по x (координаты книги) */
var RELX={L:[52.6,61.6,70.6,79.6,88.6,97.6,106.6,115.7,124.7,133.7,142.7,151.7,160.7,169.7,178.7,187.8,196.8,205.8,214.8,223.8,232.8,241.8,250.8,259.9,268.9],
          R:[269.6,278.6,288.0,297.4,306.8,316.2,325.6,335.0,344.4,353.4,362.8,372.1,381.5,390.9,400.3,409.7,419.1,428.1,437.5,446.9,456.3,465.6,475.0,484.4,493.8]};
var RELT={L:[43.8,42.8,40.4,40.1,40.1,39.8,39.1,37.9,34.9,32.5,30.8,29.1,27.8,27.0,26.3,24.5,23.3,22.9,23.2,24.7,26.1,28.6,32.8,39.3,42.9],
          R:[40.5,37.9,32.5,28.4,25.2,23.1,22.5,22.5,23.9,25.4,26.0,27.0,28.7,30.7,32.8,36.3,37.8,38.2,38.2,38.2,38.2,37.5,36.9,40.0,42.2]};
var RELB={L:[382.3,385.3,388,389,389,389,389,388.5,388.0,386.5,386.7,387.6,387.0,385.4,383.9,382.8,382.2,381.9,381.8,382.1,384.0,388,392,394,396],
          R:[397.3,395.2,392.7,389.0,385.9,383.0,382.3,382.5,382.8,383.2,384.5,386.2,388.0,389.0,389.4,389.6,389.2,389.0,390.5,391.5,392,392,392,392,392]};
var MT=17, MB=17;   /* отступ текста от верхнего и нижнего края страницы */
/* края сглажены в плавную дугу (парабола по точкам под текстом), чтобы строки не повторяли каждую неровность */
var RELF={};
function fitQ(xs,ys){var n=xs.length,S=[0,0,0,0,0],T=[0,0,0],i,x,m=0;
  for(i=0;i<n;i++){m+=ys[i]/n}
  for(i=0;i<n;i++){x=(xs[i]-270)/100;var p=1;for(var k=0;k<5;k++){S[k]+=p;if(k<3)T[k]+=ys[i]*p;p*=x}}
  var A=[[S[0],S[1],S[2]],[S[1],S[2],S[3]],[S[2],S[3],S[4]]],B=T.slice();
  for(var c=0;c<3;c++){for(var r=c+1;r<3;r++){var f=A[r][c]/A[c][c];for(var k2=c;k2<3;k2++)A[r][k2]-=f*A[c][k2];B[r]-=f*B[c]}}
  var z=[0,0,0];for(var r2=2;r2>=0;r2--){var v=B[r2];for(var k3=r2+1;k3<3;k3++)v-=A[r2][k3]*z[k3];z[r2]=v/A[r2][r2]}
  return {c:z,m:m}}
['L','R'].forEach(function(sd){var X0=sd==='R'?X0R:X0L, xs=[],t=[],b=[];
  RELX[sd].forEach(function(x,i){if(x>=X0-8&&x<=X0+PW+8){xs.push(x);t.push(RELT[sd][i]);b.push(RELB[sd][i])}});
  RELF[sd]={t:fitQ(xs,t),b:fitQ(xs,b)}});
var RELK=.7;   /* насколько сильно текст повторяет изгиб */
function relAt(arr,side,x){var f=RELF[side][arr===RELT?'t':'b'], u=(x-270)/100, y=f.c[0]+f.c[1]*u+f.c[2]*u*u; return f.m+(y-f.m)*RELK}
/* где на странице оказывается точка плоского текста (x книги, v 0..1 по высоте текстового поля) */
function relY(side,x,v){var t=relAt(RELT,side,x)+MT, b=relAt(RELB,side,x)-MB; return t+(b-t)*v}
var READ=0.13;
var Z=2, RCL=56, HCX=73, HCY=70;
var ARMX=640, ARMY=1130;
var STK_Y=388, STK_MIN=3, STK_MAX=15;
var TXL=X0L+TLL, TOPY=Y0+TT;
var RINK=3;                                /* во сколько раз текст детальнее экрана */
var MX=70, MY=90;                          /* поля вокруг книги для 3D-холста: поднятый лист выходит за её края */

var q=new URLSearchParams(location.search);
if(q.get('clean')==='1') document.body.classList.add('clean');
var LENS=q.get('lens')==='1';
if(LENS) document.body.classList.add('haslens');
var stage=document.getElementById('stage'), pL=document.getElementById('pL'), pR=document.getElementById('pR'),
    bookwrap=document.getElementById('bookwrap'), spread=document.getElementById('spread'),
    lens=document.getElementById('lens'), glass=document.getElementById('glass'), arm=document.getElementById('arm'),

    glc=document.getElementById('gl');

var rs=stage.style;
rs.setProperty('--pw',PW+'px'); rs.setProperty('--ph',PH+'px'); rs.setProperty('--lw',LW+'px'); rs.setProperty('--lh',LHT+'px');
rs.setProperty('--txR',(X0R-LX0)+'px'); rs.setProperty('--txL',(X0L-(LX0-LW))+'px'); rs.setProperty('--tyy',(Y0-LY0)+'px');
bookwrap.style.cssText+='left:'+BX+'px;top:'+BY+'px;width:'+BW+'px;height:'+BH+'px';
pL.style.left=(LX0-LW)+'px'; pL.style.top=LY0+'px'; pR.style.left=LX0+'px'; pR.style.top=LY0+'px';


/* зерно бумаги для табличек: чернила ложатся неравномерно */
(function(){var c=document.createElement('canvas'); c.width=c.height=90; var g=c.getContext('2d'), d=g.createImageData(90,90);
  for(var i=0;i<8100;i++){d.data[i*4+3]=Math.random()<.24?255-Math.random()*190:255} g.putImageData(d,0,0);
  stage.style.setProperty('--grain','url('+c.toDataURL()+')')})();
function fit(){stage.style.transform='scale('+Math.min(innerWidth/540,innerHeight/960)+')'}
addEventListener('resize',fit); fit();

function rnd(a,b){return a+Math.random()*(b-a)}
function pick(a){return a[Math.random()*a.length|0]}
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
function lerp(a,b,t){return a+(b-a)*t}

/* ---------- руки ---------- */
var HANDS={
 lens:{img:'assets/hand_lens.webp',W:520,H:1075,sc:.15,xl:3,xr:505,sk:0,taper:1,
   stops:['#3f1d2d','#783f41','#4d2129','#5d2d34','#8b4c51','#673238','#461f27','#462227','#462a40']},
 pinch:{img:'assets/hand_pinch2.webp',W:560,H:1285,px:235,py:48,ba:98,sc:.375,noext:1,s:.97,v:.9,cb:.55,vr:[.55,.95]},
 palm:{img:'assets/hand_palm2.webp',W:560,H:1087,px:30,py:12,ba:73.5,sc:.41,noext:1,s:.9,v:.55,cb:0,vr:[.4,.8]},
 two:{img:'assets/hand_two2.webp',W:560,H:998,px:185,py:15,ba:86,sc:.41,noext:1,s:.97,v:.45,cb:.1,vr:[.35,.75]},
 quill:{img:'assets/hand_quill2.webp',W:560,H:1166,px:100,py:178,ba:72,sc:.4,noext:1}
};
function buildHand(h,box,ext){
  var im=document.createElement('img'); im.src=h.img; im.alt=''; im.style.width=h.W+'px'; im.style.height=h.H+'px';
  if(h.noext){im.style.webkitMaskImage=im.style.maskImage='linear-gradient(180deg,#000 0,#000 68%,transparent 97%)'}
  box.appendChild(im);
  if(h.noext) {box.style.width=h.W+'px'; box.style.height=h.H+'px'; return}
  var e=document.createElement('div'); e.className='ext';
  var E=ext/h.sc;
  e.style.cssText='left:'+h.xl+'px;top:'+(h.H-3)+'px;width:'+(h.xr-h.xl)+'px;height:'+E+'px;transform:matrix(1,0,'+h.sk+',1,0,0);'+
    'background:linear-gradient(180deg,transparent 0 250px,#5a3a14 250px,#e2b455 262px,#b07a24 282px,#3d2308 294px,transparent 294px),linear-gradient(180deg,rgba(0,0,0,0) 0,rgba(0,0,0,.28) 14%,rgba(0,0,0,.78) 40%),linear-gradient(90deg,'+h.stops.map(function(c,i){return c+' '+(i*100/(h.stops.length-1)).toFixed(0)+'%'}).join(',')+')'+(h.taper?';clip-path:polygon(0 0,100% 0,78% 100%,22% 100%)':'');
  box.appendChild(e);
  box.style.width=h.W+'px'; box.style.height=h.H+'px';
}
if(LENS){
  var h0=HANDS.lens, box0=document.getElementById('fistin');
  buildHand(h0,box0,1500);
  box0.style.left=(-h0.W*h0.sc/2)+'px'; box0.style.top='0px'; box0.style.transform='scale('+h0.sc+')';
}
['pinch','palm','two'].forEach(function(n){
  var h=HANDS[n], fx=document.createElement('div'), w=document.createElement('div'); fx.className='handfx'; w.className='hand'; w.id='hand_'+n; h.el=w; h.fx=fx; fx.appendChild(w);
  var inner=document.createElement('div'); inner.className='hin';
  buildHand(h,inner,900);
  inner.style.left=(-h.px*h.sc)+'px'; inner.style.top=(-h.py*h.sc)+'px'; inner.style.transform='scale('+h.sc+')';
  w.appendChild(inner); stage.insertBefore(fx,document.getElementById('light'));
});

var S={pages:[],spread:0,seq:[],cur:0,el:0,playing:true,flipping:false,hold:0,act:null,actCur:-1,clone:null,
       lx:TXL,ly:TOPY+LH/2,tx:TXL,ty:TOPY+LH/2};

/* ---------- текст «чернилами» ---------- */
var meas=document.createElement('canvas').getContext('2d');
function paginate(text){
  meas.font=FS+'px Lora, Georgia, serif';
  var paras=String(text).split(/\n+/).map(function(s){return s.trim()}).filter(Boolean), lines=[];
  paras.forEach(function(p){
    var words=p.split(/\s+/), cur='  ', first=true;
    words.forEach(function(w){
      var test=first?cur+w:cur+' '+w;
      if(meas.measureText(test).width>TW && !first){lines.push({text:cur});cur='';test=w}
      cur=test; first=false;
    });
    lines.push({text:cur});
  });
  lines.forEach(function(l){l.w=Math.min(TW,meas.measureText(l.text).width)});
  var pages=[];
  for(var i=0;i<lines.length;i+=PERP) pages.push({lines:lines.slice(i,i+PERP)});
  if(pages.length%2) pages.push({lines:[],blank:true});
  return pages;
}
/* зерно бумаги: вытравливает чернила неравномерно, как на настоящей странице */
var NOISE=(function(){
  var n=document.createElement('canvas'); n.width=n.height=256; var g=n.getContext('2d');
  var lo=document.createElement('canvas'); lo.width=lo.height=24; var lg=lo.getContext('2d'), id=lg.createImageData(24,24), i;
  for(i=0;i<576;i++){id.data[i*4]=id.data[i*4+1]=id.data[i*4+2]=0; id.data[i*4+3]=Math.random()*70}
  lg.putImageData(id,0,0); g.imageSmoothingEnabled=true; g.drawImage(lo,0,0,256,256);
  var hi=g.getImageData(0,0,256,256);
  for(i=0;i<65536;i++){ if(Math.random()<.17) hi.data[i*4+3]=Math.min(255,hi.data[i*4+3]+90+Math.random()*140); hi.data[i*4]=hi.data[i*4+1]=hi.data[i*4+2]=0 }
  g.putImageData(hi,0,0);
  return n;
})();
var INKC=['#2c190a','#35200e','#2a1709','#3b2511'];
function inkCanvas(pg,side,num){
  if(pg._c&&pg._c.side===side) return pg._c.cv;
  var c=document.createElement('canvas'); c.width=PW*RINK; c.height=PH*RINK; var g=c.getContext('2d');
  g.scale(RINK,RINK); g.font=FS+'px Lora, Georgia, serif'; g.textBaseline='alphabetic';
  g.shadowColor='rgba(70,35,8,.38)'; g.shadowBlur=1.1;
  var x0=side==='L'?TLL:TLR;
  pg.lines.forEach(function(l,i){
    var y=TT+i*LH+12.6, x=x0;
    l.text.split(/(\s+)/).forEach(function(tok){
      if(!tok) return;
      var w=g.measureText(tok).width;
      if(/\S/.test(tok)){
        g.save(); g.globalAlpha=rnd(.82,.97); g.fillStyle=pick(INKC);
        g.translate(x+rnd(-.2,.2),y+rnd(-.3,.3)); g.rotate(rnd(-.006,.006)); g.fillText(tok,0,0); g.restore();
      }
      x+=w;
    });
  });
  g.shadowBlur=0; g.globalAlpha=.6; g.fillStyle='#5a3a1a'; g.font='italic 11px Lora, Georgia, serif'; g.textAlign='center';
  if(!pg.blank) g.fillText(String(num),PW/2,PH-9); g.globalAlpha=1;
  g.setTransform(1,0,0,1,0,0); g.globalCompositeOperation='destination-out';
  g.fillStyle=g.createPattern(NOISE,'repeat'); g.fillRect(0,0,c.width,c.height);
  pg._c={cv:c,side:side,url:null};
  return c;
}
/* страница = вырезка нарисованной страницы из картины + текст, впитанный в бумагу */

function setStory(text){

var last=performance.now();
function tick(now){
  var dt=Math.min(.1,(now-last)/1000); last=now;
  if(S.playing && !S.flipping){
    if(S.hold>0){S.hold-=dt; if(S.hold<=0){S.hold=0; nextSpread()}}
    else if(S.seq.length){
      var ln=S.seq[S.cur];
      if(S.actCur!==S.cur){S.actCur=S.cur; S.act={side:ln.side,i:ln.i}; markActive()}
      S.el+=dt; var t=Math.min(1,S.el/ln.dur);
      S.tx=(ln.side==='L'?X0L+TLL:X0R+TLR)+t*ln.w; S.ty=TOPY+LH*ln.i+LH/2;
      if(S.el>=ln.dur){S.cur++; S.el=0; if(S.cur>=S.seq.length) S.hold=1.2}
    } else S.hold=1.2;
  }
  if(LENS){
    var gx=S.tx, gy=S.playing?S.ty:BH+300;
    var k=1-Math.exp(-dt*(S.playing?3.5:2.2));
    S.lx+=(gx-S.lx)*k; S.ly+=(gy-S.ly)*k;
    var dx=S.lx+Math.sin(now/900)*.8, dy=S.ly+Math.cos(now/700)*.8;
    lens.style.transform='translate('+(BX+dx-HCX)+'px,'+(BY+dy-HCY)+'px)';
    var cx=BX+dx, cy=BY+dy;
    arm.style.transform='rotate('+(Math.atan2(ARMY-cy,ARMX-cx)*180/Math.PI).toFixed(2)+'deg)';
    if(S.clone) S.clone.style.transform='translate('+(RCL-Z*dx)+'px,'+(RCL-Z*dy)+'px) scale('+Z+')';
  }
  requestAnimationFrame(tick);
}

var FLAME=(function(){
  var c=document.getElementById('flamecv'), g=c.getContext('2d'), W=60, H=120, R=3;
  c.width=W*R; c.height=H*R; g.scale(R,R);

  var gust=0, gv=0, bx=30, by=114;

  function drop(cy,h,w,tx){

    g.quadraticCurveTo(bx+tx*.8+w*.12,cy-h*.86, bx+tx*.35+w*.3,cy-h*.66);

    var t=now/1000;
    if(Math.random()<.003) gv=rnd(.5,1.1)*(Math.random()<.5?-1:1);
    gust+=(gv-gust)*.05; gv*=.975;
    var flick=.06*nz(t*1.4,0)+.035*nz(t*6.5,1)+(Math.random()<.02?rnd(-.04,.05):0);
    var h=60*(1+flick)*(1-.15*Math.abs(gust)), w=7.2*(1+.04*nz(t*2,2)+.5*Math.abs(gust)*.2);
    var tx=3.2*nz(t*.7,3)+1.4*nz(t*3.1,4)+11*gust+.6*nz(t*11,5);
    g.clearRect(0,0,W,H);
    /* мягкий ореол */
    g.globalCompositeOperation='lighter';

    go.addColorStop(0,'rgba(255,120,40,0)'); go.addColorStop(.12,'rgba(255,140,45,.75)'); go.addColorStop(.55,'rgba(255,150,50,.9)');

    g.fillStyle=go; drop(by,h,w,tx); g.fill();

    g.filter='blur(.8px)';
    var gi=g.createLinearGradient(0,by-4,0,by-h*.82);
    gi.addColorStop(0,'rgba(255,236,170,0)'); gi.addColorStop(.18,'rgba(255,248,215,.95)'); gi.addColorStop(.6,'rgba(255,232,150,.95)'); gi.addColorStop(1,'rgba(255,200,90,0)');
    g.fillStyle=gi; drop(by-5,h*.8,w*.68,tx*.8); g.fill();

/* ---------- таблички: чёткий текст с наклоном стены ---------- */
var TILT=+(q.get('tilt')||-22), ROT=+(q.get('rot')||0);   /* наклон стены назад (градусы) и поворот в плоскости */
function Plaque(id,max,fs,rot){
  var el=document.getElementById(id), W=parseFloat(getComputedStyle(el).width), H=parseFloat(getComputedStyle(el).height), R=3;
  el.width=W*R; el.height=H*R;
  var F=document.createElement('canvas'); F.width=W*R; F.height=H*R;
  var g=el.getContext('2d'), f=F.getContext('2d'), items=[], anim=false, PAD=7, LHp=fs*1.36;
  function fit(t,w){ if(f.measureText(t).width<=w) return t; while(t.length&&f.measureText(t+'…').width>w) t=t.slice(0,-1); return t+'…' }
  function flat(now){
    f.setTransform(R,0,0,R,0,0); f.clearRect(0,0,W,H); f.textBaseline='middle';
    var y0=H/2-(items.length-1)*LHp/2, busy=false;
    items.forEach(function(it,i){
      var a=Math.min(1,(now-it.t0)/650); if(a<1) busy=true;
      f.globalAlpha=a; var x=PAD, y=y0+i*LHp, w=W-2*PAD;
      f.font='600 '+fs+'px Lora, Georgia, serif'; f.fillStyle='#5e1d09';
      var n=fit(it.name,w*.62); f.fillText(n,x,y); x+=f.measureText(n).width;
      f.font=fs+'px Lora, Georgia, serif'; f.fillStyle='#24120a';
      f.fillText(fit(it.sep+it.text,W-PAD-x),x,y);
    });
    f.globalAlpha=1; return busy;
  }
  /* перспектива: плоскость таблички наклонена назад вокруг нижнего края, верх дальше и уже */
  function warp(){
    g.setTransform(1,0,0,1,0,0); g.clearRect(0,0,el.width,el.height);
    var th=TILT*Math.PI/180, D=H*4.2*R, c=Math.cos(th), s=Math.sin(th), Hp=F.height, cx=F.width/2;
    var hOut=Hp*c*D/(D+Hp*s), oy=(Hp-hOut)/2;
    var km=Math.max(1,D/(D+Hp*s), hOut/Hp);
    g.translate(cx,Hp/2); g.rotate((rot+ROT)*Math.PI/180); g.scale(1/km,1/km); g.translate(-cx,-Hp/2);
    for(var yo=0;yo<hOut;yo+=1){
      var u=yo*D/(c*D-yo*s), k=D/(D+u*s), sy=Hp-u;          /* yo считаем от низа */
      if(sy<0) break;

      g.drawImage(F,0,sy-1,F.width,1,cx-w/2,Hp-oy-yo-1,w,1.6);
    }
  }
  function render(now){ var busy=flat(now); warp(); if(busy) requestAnimationFrame(render); else anim=false }
  document.fonts.ready.then(function(){if(!anim){anim=true; requestAnimationFrame(render)}});
  return {add:function(name,sep,text){
    items.push({name:String(name),sep:sep,text:String(text),t0:performance.now()}); while(items.length>max) items.shift();
    if(!anim){anim=true; requestAnimationFrame(render)}
  }};
}

"Человек медленно писал. Я узнал свой свитер, свои волосы, свои худые плечи. Он поднял голову, посмотрел на меня через стекло и улыбнулся так, как никогда не улыбался я сам.",
"Потом он показал рукой на дверь, будто приглашая войти. А на стекле, с внутренней стороны, проступили буквы. Они складывались в слово, и слово это было «Заходи».",
"Я простоял на крыльце до самого вечера. Когда стемнело, свеча в моих руках погасла сама, но в окнах дома тут же вспыхнул тёплый свет, и стало видно, как там накрыт стол на троих.",
"Из темноты вышла бабушка Нина. Она встала рядом и долго молчала, глядя на окна. «Пойдём домой, — сказала она наконец. — Пока не поздно. Он зовёт только того, кто откликнется».",
"Я сделал шаг назад. Потом ещё один. Свет в окнах дрогнул, и по стёклам одна за другой побежали тёмные тени. Дом будто выдохнул, и в этом выдохе я услышал тысячу шёпотов.",
"Мы шли по дороге, не оглядываясь. Бабушка крепко держала меня за локоть. На краю деревни она остановилась и вынула из кармана маленькую свечку. «Зажги, — сказала она. — У дома своя свеча. А у тебя будет своя».",
"Я зажёг. Огонёк встал ровно и тихо, и впервые за много дней на душе стало спокойно. Тень на дороге опять была обычной тенью. Только одной.",
"С тех пор я не хожу к старому дому. Но иногда, когда ветер стихает, я слышу, как оттуда доносится тихий шелест, будто кто-то переворачивает страницы, и мне кажется, он ещё ждёт.",
"Брата я больше не видел. Говорят, он уехал в город. Говорят, женился. Только на каждый праздник мне приходит открытка, подписанная его рукой, и каждый раз почерк на ней немного другой.",
"А в этом году в конверт был вложен чистый лист. Просто белый лист, сложенный вдвое. Я развернул его у окна, и на свету проступили слова, написанные водой: «Скоро твоя очередь читать».",
"Я зажёг свечу и положил лист рядом. Слова не исчезли. Они проступали всё ярче, и под ними появлялись новые строчки, а я читал их вслух, потому что не мог остановиться.",
"И вот сейчас, пока я читаю вам эту историю, мне кажется, что за моей спиной кто-то стоит. Спасибо, что остались до конца. Не выключайте свет. И не оборачивайтесь."
].join('\n');

window.Book={addChat:addChat,addGift:addGift,setStory:setStory,
  play:function(){S.playing=true;sync()},pause:function(){S.playing=false;sync()},
  flip:function(pose){flipTo((S.spread+1)%spreadsCount(),pose)},
  preview:function(pose,e,ov){            /* для проверки: кадр листания при прогрессе e */
    var P=Object.assign(mkParams(pose),ov||{}); prep(S.spread); GLX.setTex(PREP.f,PREP.b); GLX.draw(phiAt(P,e,.3),true); return P},
  clearPreview:function(){GLX.clear()},
  simPreview:function(ms,ov,pose){          /* для проверки: состояние физического листа через ms после начала тяги */
    var P=Object.assign(sheetParams(),{ease:'sine'},ov||{}), H=HANDS[pose||'pinch'];
    prep(S.spread); GLX.setTex(leafVar(PREP.f,'R'),leafVar(PREP.b,'L')); PAPER.reset();
    var G=makeGrab(H,grabSpot(H));
    for(var t=0;t<ms;t+=1000/120){var u=t/P.dur; if(u<1) setGrab(G,EASE[P.ease](u),P); PAPER.step(1/120,P,u<1?G.pins:null)}
    GLX.drawSim(PAPER.p,1); return {P:P,maxZ:PAPER.maxZ()}}};

var bPlay=document.getElementById('bPlay');
function sync(){bPlay.textContent=S.playing?'❚❚':'▶'}
bPlay.onclick=function(){S.playing=!S.playing;sync()};
document.getElementById('bNext').onclick=function(){nextSpread()};
document.getElementById('bPrev').onclick=function(){
  if(S.flipping) return;
  S.spread=(S.spread-1+spreadsCount())%spreadsCount(); renderSpread(S.spread); buildSeq(); refreshLens();
  S.lx=S.tx=TXL; S.ly=S.ty=TOPY+LH/2; S.hold=0;
};
