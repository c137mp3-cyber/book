<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Книга для эфира</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:#0a0604;overflow:hidden;font-family:Lora,Georgia,serif}
#wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
#stage{position:relative;width:540px;height:960px;flex:none;overflow:hidden;--f:1;--sk:0deg;background:#3b2414}

#table{position:absolute;inset:0;background:#3b2414 url(assets/table.webp) center/cover no-repeat}
.prop{position:absolute;z-index:3;display:block;filter:drop-shadow(0 5px 5px rgba(0,0,0,.55))}

/* таблички: одна картинка рамки, внутри чистый пергамент */
.plaque{position:absolute;top:8px;z-index:10;color:#3a2412;padding:10px 24px;
  background:url(assets/plaque.webp) 0 0/100% 100% no-repeat;filter:drop-shadow(0 4px 5px rgba(0,0,0,.55))}
.list{display:flex;flex-direction:column;justify-content:center;height:100%;gap:2px}
.list .m{font:12.5px/1.3 Lora,Georgia,serif;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;animation:pop .35s ease-out}
.list .m b{color:#7a2e12;font-weight:600}
@keyframes pop{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
#giftsPlaque.flash{animation:flash .9s ease-out}
@keyframes flash{0%{filter:drop-shadow(0 0 0 rgba(255,200,90,0))}30%{filter:drop-shadow(0 0 14px rgba(255,200,90,.95))}100%{filter:drop-shadow(0 4px 5px rgba(0,0,0,.55))}}

#bookwrap{position:absolute;z-index:6;filter:drop-shadow(0 10px 12px rgba(0,0,0,.55))}
.bookimg{position:absolute;left:0;top:0;width:100%;height:100%;display:block}
.stk{position:absolute;height:3px;transition:height 1.4s ease-in-out;
  background:repeating-linear-gradient(180deg,#f4dca6 0 1.3px,#b98a4c 1.3px 2.2px,#e8cb8e 2.2px 3.2px);
  box-shadow:inset 0 -4px 5px rgba(70,35,8,.55)}
.spreadbox{position:absolute;inset:0;perspective:1600px}
.pg{position:absolute;width:var(--pw);height:var(--ph)}
.paper{position:absolute;inset:0;background-repeat:no-repeat}
.text{position:absolute;width:var(--tw);top:var(--tt)}
.pg.L .text{left:var(--tlL)}.pg.R .text{left:var(--tlR)}
.line{height:20px;font:15px/20px Lora,Georgia,serif;white-space:pre;color:#3a2412;border-radius:3px}
.line.on{color:#1d0f05;background:linear-gradient(90deg,rgba(255,196,90,0),rgba(255,196,90,.42) 6%,rgba(255,196,90,.42) 94%,rgba(255,196,90,0))}
.pn{position:absolute;left:0;right:0;text-align:center;font:italic 12px Lora,Georgia,serif;color:#6b4a22;opacity:.75}
.pg .pn{bottom:8px}

/* лист из полос: каждая полоса вращается относительно предыдущей, поэтому бумага гнётся */
.leaf{position:absolute;transform-style:preserve-3d;z-index:5;width:var(--pw);height:var(--ph)}
.strip{position:absolute;top:0;height:100%;transform-origin:0 50%;transform-style:preserve-3d}
.face{position:absolute;left:0;top:0;width:100%;height:100%;overflow:hidden;backface-visibility:hidden;-webkit-backface-visibility:hidden}
.face.b{transform:rotateY(180deg)}
.sh{position:absolute;inset:0;background:#2a1406;opacity:0;pointer-events:none}

#candle{position:absolute;left:-14px;top:150px;width:96px;height:92px;z-index:8}
#candleimg{position:absolute;left:0;top:0;width:96px;height:92px;display:block}
#glow{position:absolute;left:-166px;top:-179px;width:420px;height:420px;pointer-events:none;
  background:radial-gradient(circle,rgba(255,170,70,.55),rgba(255,140,40,.18) 40%,transparent 65%);
  opacity:calc(.55 + .45*var(--f));transition:opacity .1s linear}
#flame{position:absolute;left:33px;top:-7px;width:22px;height:38px;transform-origin:50% 100%;
  transform:scale(calc(.9 + .14*var(--f))) skewX(var(--sk));transition:transform .1s linear}
#ink{position:absolute;left:462px;top:150px;width:80px;height:82px;z-index:8;filter:drop-shadow(0 4px 5px rgba(0,0,0,.5))}
#quill{position:absolute;left:439px;top:81px;width:64px;height:110px;z-index:9;transform:scaleX(-1);filter:drop-shadow(0 5px 5px rgba(0,0,0,.45))}

#light{position:absolute;inset:0;z-index:20;pointer-events:none;mix-blend-mode:screen;
  background:radial-gradient(circle at 6% 19%,rgba(255,170,80,.3),transparent 50%);
  opacity:calc(.6 + .4*var(--f));transition:opacity .1s linear}
#vig{position:absolute;inset:0;z-index:25;pointer-events:none;background:radial-gradient(ellipse at 50% 55%,transparent 55%,rgba(0,0,0,.5) 100%)}

/* лупа вместе с рукой: .arm поворачивается так, что рука идёт от лупы к нижнему краю экрана */
.lens{position:absolute;left:0;top:0;width:227px;height:196px;z-index:30;pointer-events:none;transition:opacity .4s;
  filter:drop-shadow(0 8px 8px rgba(0,0,0,.5))}
.glass{position:absolute;left:17px;top:14px;width:112px;height:112px;border-radius:50%;overflow:hidden;z-index:1;background:#e6c88a}
.glass::after{content:"";position:absolute;inset:0;border-radius:50%;pointer-events:none;
  background:radial-gradient(circle at 30% 25%,rgba(255,255,255,.3),transparent 40%);box-shadow:inset 0 0 14px rgba(0,0,0,.4)}
.arm{position:absolute;left:73px;top:70px;width:0;height:0;z-index:2}
.ring{position:absolute;left:-73px;top:-70px;width:227px;height:196px;transform-origin:73px 70px;transform:rotate(-38deg);display:block}
.fist{position:absolute;left:104px;top:0;width:0;height:0;transform:rotate(-90deg)}
.hin{position:absolute;transform-origin:0 0}
.hin>img{position:absolute;left:0;top:0;display:block}
.ext{position:absolute;transform-origin:0 0}

/* руки для листания */
.hand{position:absolute;left:0;top:0;width:0;height:0;z-index:31;pointer-events:none;display:none;
  filter:drop-shadow(0 8px 8px rgba(0,0,0,.5))}

#ctl{position:fixed;bottom:8px;left:50%;transform:translateX(-50%);display:flex;gap:8px;z-index:100}
#ctl button{font:14px Lora,Georgia,serif;color:#f1deb0;background:rgba(30,18,8,.75);border:1px solid #8d6420;border-radius:8px;padding:8px 14px}
body.clean #ctl{display:none}
</style>
</head>
<body>
<div id="wrap">
<div id="stage">
  <div id="table"></div>

  <img class="prop" src="assets/scroll1.webp" alt="" style="left:-34px;top:716px;width:210px;transform:rotate(7deg)">
  <img class="prop" src="assets/bottle_red.webp" alt="" style="left:172px;top:776px;width:58px;transform:rotate(-8deg)">
  <img class="prop" src="assets/scroll2.webp" alt="" style="left:352px;top:828px;width:200px;transform:rotate(-5deg)">
  <img class="prop" src="assets/bottle_blue.webp" alt="" style="left:96px;top:196px;width:42px;transform:rotate(6deg)">

  <div class="plaque" id="chatPlaque" style="left:10px;width:272px;height:68px"><div class="list" id="chat"></div></div>
  <div class="plaque" id="giftsPlaque" style="left:344px;width:188px;height:68px"><div class="list" id="gifts"></div></div>

  <div id="bookwrap">
    <img class="bookimg" src="assets/book.webp" alt="">
    <div class="stk" id="stkL"></div>
    <div class="stk" id="stkR"></div>
    <div id="spread" class="spreadbox">
      <div class="pg L" id="pL"></div>
      <div class="pg R" id="pR"></div>
    </div>
  </div>

  <div id="candle">
    <div id="glow"></div>
    <img id="candleimg" src="assets/candle.webp" alt="">
    <svg id="flame" viewBox="0 0 30 52" aria-hidden="true">
      <path d="M15 2 C23 16,27 32,15 51 C3 32,7 16,15 2Z" fill="#ff9a2a"/>
      <path d="M15 20 C20 30,21 40,15 50 C9 40,10 30,15 20Z" fill="#ffe38a"/>
    </svg>
  </div>

  <img id="ink" src="assets/ink.webp" alt="">
  <img id="quill" src="assets/quill.webp" alt="">

  <div class="lens" id="lens">
    <div class="glass" id="glass"></div>
    <div class="arm" id="arm">
      <img class="ring" src="assets/lens.webp" alt="">
      <div class="fist"><div class="hin" id="fistin"></div></div>
    </div>
  </div>

  <div class="hand" id="hand"></div>

  <div id="light"></div>
  <div id="vig"></div>
</div>
</div>

<div id="ctl">
  <button id="bPrev">◀</button>
  <button id="bPlay">❚❚</button>
  <button id="bNext">▶</button>
  <button id="bGift">Подарок</button>
</div>

<script>
(function(){
/* Геометрия книги: горизонтальный разворот. Левая страница заканчивается там, где начинается правая (корешок) */
var BX=-45, BY=258, BW=640, BH=401, BOOK='assets/book.webp';
var PW=270, PH=325, X0L=52, X0R=322, Y0=38;
var TW=226, TLL=22, TLR=22, TT=22, LH=20, PERP=14;
var READ=0.13;                       /* секунд на знак: чем больше, тем медленнее лупа */
var Z=2, RCL=56, HCX=73, HCY=70;     /* лупа */
var ARMX=620, ARMY=1180;             /* где «локоть» руки с лупой за краем экрана */
var STK_Y=383, STK_MIN=3, STK_MAX=15;/* толщина блока страниц под книгой */
var NS=12;                           /* число полос в листе */
var TXL=X0L+TLL, TOPY=Y0+TT;

var q=new URLSearchParams(location.search);
if(q.get('clean')==='1') document.body.classList.add('clean');
var stage=document.getElementById('stage'), pL=document.getElementById('pL'), pR=document.getElementById('pR'),
    bookwrap=document.getElementById('bookwrap'), spread=document.getElementById('spread'),
    lens=document.getElementById('lens'), glass=document.getElementById('glass'), arm=document.getElementById('arm'),
    handBox=document.getElementById('hand'),
    chat=document.getElementById('chat'), gifts=document.getElementById('gifts'), giftsPlaque=document.getElementById('giftsPlaque');

var rs=stage.style;
rs.setProperty('--pw',PW+'px'); rs.setProperty('--ph',PH+'px'); rs.setProperty('--tw',TW+'px');
rs.setProperty('--tlL',TLL+'px'); rs.setProperty('--tlR',TLR+'px'); rs.setProperty('--tt',TT+'px');
bookwrap.style.cssText+='left:'+BX+'px;top:'+BY+'px;width:'+BW+'px;height:'+BH+'px';
pL.style.left=X0L+'px'; pL.style.top=Y0+'px'; pR.style.left=X0R+'px'; pR.style.top=Y0+'px';

function fit(){stage.style.transform='scale('+Math.min(innerWidth/540,innerHeight/960)+')'}
addEventListener('resize',fit); fit();

function rnd(a,b){return a+Math.random()*(b-a)}
function pick(a){return a[Math.random()*a.length|0]}
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}

/* ---------- руки ---------- */
/* W,H — размер картинки; px,py — точка касания; ba — угол предплечья на картинке; sc — масштаб;
   xl,xr — края рукава в нижней строке (достраиваем рукав до края экрана); sk — наклон рукава; stops — цвета рукава */
var HANDS={
 lens:{img:'assets/hand_lens.webp',W:520,H:1075,sc:.15,xl:3,xr:505,sk:0,taper:1,
   stops:['#3f1d2d','#783f41','#4d2129','#5d2d34','#8b4c51','#673238','#461f27','#462227','#462a40']},
 pinch:{img:'assets/hand_pinch.webp',W:520,H:544,px:147,py:57,ba:70,sc:.42,xl:326,xr:516,sk:.36,s:.97,v:.93,
   stops:['#4b1326','#45152b','#451629','#441426','#4d182c','#601e31','#712637','#621f31','#561828']},
 palm:{img:'assets/hand_palm.webp',W:520,H:677,px:55,py:45,ba:68,sc:.36,xl:290,xr:516,sk:.36,s:.9,v:.55,
   stops:['#350c1e','#350c1e','#5e1e2f','#541a2c','#903742','#79293a','#471224','#571427','#571427']},
 two:{img:'assets/hand_two.webp',W:520,H:668,px:48,py:18,ba:70,sc:.36,xl:280,xr:515,sk:.36,s:.97,v:.45,
   stops:['#4c1421','#431321','#501827','#471322','#7e2e3a','#66232f','#531927','#571826','#571826']}
};
function buildHand(h,box,ext){
  var im=document.createElement('img'); im.src=h.img; im.alt=''; im.style.width=h.W+'px'; im.style.height=h.H+'px';
  box.appendChild(im);
  var e=document.createElement('div'); e.className='ext';
  var E=ext/h.sc;
  e.style.cssText='left:'+h.xl+'px;top:'+(h.H-3)+'px;width:'+(h.xr-h.xl)+'px;height:'+E+'px;transform:matrix(1,0,'+h.sk+',1,0,0);'+
    'background:linear-gradient(180deg,rgba(0,0,0,0) 0,rgba(0,0,0,.28) 14%,rgba(0,0,0,.78) 40%),linear-gradient(90deg,'+h.stops.map(function(c,i){return c+' '+(i*100/(h.stops.length-1)).toFixed(0)+'%'}).join(',')+')'+(h.taper?';clip-path:polygon(0 0,100% 0,78% 100%,22% 100%)':'');
  box.appendChild(e);
  box.style.width=h.W+'px'; box.style.height=h.H+'px';
}
/* кулак с лупой */
(function(){
  var h=HANDS.lens, box=document.getElementById('fistin');
  buildHand(h,box,1500);
  box.style.left=(-h.W*h.sc/2)+'px'; box.style.top='0px'; box.style.transform='scale('+h.sc+')';
})();
/* руки для листания: по одному контейнеру на позу */
['pinch','palm','two'].forEach(function(n){
  var h=HANDS[n], w=document.createElement('div'); w.className='hand'; w.id='hand_'+n; h.el=w;
  var inner=document.createElement('div'); inner.className='hin';
  buildHand(h,inner,900);
  inner.style.left=(-h.px*h.sc)+'px'; inner.style.top=(-h.py*h.sc)+'px'; inner.style.transform='scale('+h.sc+')';
  w.appendChild(inner); document.getElementById('stage').insertBefore(w,document.getElementById('light'));
});

var S={pages:[],spread:0,seq:[],cur:0,el:0,playing:true,flipping:false,hold:0,act:null,actCur:-1,clone:null,
       lx:TXL,ly:TOPY+LH/2,tx:TXL,ty:TOPY+LH/2};

var meas=document.createElement('canvas').getContext('2d');
function paginate(text){
  meas.font='15px Lora, Georgia, serif';
  var paras=String(text).split(/\n+/).map(function(s){return s.trim()}).filter(Boolean), lines=[];
  paras.forEach(function(p){
    var words=p.split(/\s+/), cur='  ', first=true;
    words.forEach(function(w){
      var test=first?cur+w:cur+' '+w;
      if(meas.measureText(test).width>TW && !first){lines.push({text:cur});cur='';test=w}
      cur=test; first=false;
    });
    lines.push({text:cur});
  });
  lines.forEach(function(l){l.w=Math.min(TW,meas.measureText(l.text).width)});
  var pages=[];
  for(var i=0;i<lines.length;i+=PERP) pages.push({lines:lines.slice(i,i+PERP)});
  if(pages.length%2) pages.push(null);
  return pages;
}

/* рваные края: spine — сторона корешка, она остаётся ровной */
function torn(spine){
  var j=function(){var r=Math.random();return r<.12?1.6+Math.random()*2.4:Math.random()*1.0};
  var st=function(){return 4+Math.random()*4}, p=[], x, y;
  for(x=0;x<100;x+=st()) p.push([x,spine==='top'?0:j()]);
  for(y=0;y<100;y+=st()) p.push([spine==='right'?100:100-j(),y]);
  for(x=100;x>0;x-=st()) p.push([x,spine==='bottom'?100:100-j()]);
  for(y=100;y>0;y-=st()) p.push([spine==='left'?0:j(),y]);
  return 'polygon('+p.map(function(a){return a[0].toFixed(1)+'% '+a[1].toFixed(1)+'%'}).join(',')+')';
}
function pageHTML(pg,side,num,paper){
  var h='';
  if(paper){
    var ox=side==='L'?X0L:X0R;
    h+='<div class="paper" style="clip-path:'+torn(side==='L'?'right':'left')+';background-image:url('+BOOK+');background-size:'+BW+'px '+BH+'px;background-position:-'+ox+'px -'+Y0+'px"></div>';
  }
  h+='<div class="text">';
  if(pg) pg.lines.forEach(function(l){h+='<div class="line">'+esc(l.text)+'</div>'});
  h+='</div>';
  if(pg) h+='<div class="pn">'+num+'</div>';
  return h;
}
function renderSpread(i){
  pL.innerHTML=pageHTML(S.pages[2*i],'L',2*i+1,false);
  pR.innerHTML=pageHTML(S.pages[2*i+1],'R',2*i+2,false);
  setStack(i,false);
}

/* блок страниц: слева растёт, справа уменьшается по мере чтения */
function raggedTop(){
  var p=['0 '+rnd(0,2.5).toFixed(1)+'px'], x;
  for(x=6;x<100;x+=rnd(4,8)) p.push(x.toFixed(1)+'% '+rnd(0,2.5).toFixed(1)+'px');
  p.push('100% '+rnd(0,2.5).toFixed(1)+'px','100% 100%','0 100%');
  return 'polygon('+p.join(',')+')';
}
(function(){
  [['stkL',X0L-6],['stkR',X0R]].forEach(function(a){
    var e=document.getElementById(a[0]); e.style.left=a[1]+'px'; e.style.width=(PW+6)+'px'; e.style.top=STK_Y+'px'; e.style.clipPath=raggedTop();
  });
})();
function spreadsCount(){return Math.max(1,Math.ceil(S.pages.length/2))}
function setStack(i,anim){
  var n=spreadsCount(), p=n>1?i/(n-1):0;
  var hl=STK_MIN+(STK_MAX-STK_MIN)*p, hr=STK_MIN+(STK_MAX-STK_MIN)*(1-p);
  var l=document.getElementById('stkL'), r=document.getElementById('stkR');
  if(!anim){l.style.transition=r.style.transition='none'}
  l.style.height=hl+'px'; r.style.height=hr+'px';
  if(!anim){void l.offsetWidth; l.style.transition=r.style.transition=''}
}

function markActive(){
  [bookwrap,S.clone].forEach(function(root){
    if(!root) return;
    root.querySelectorAll('.line.on').forEach(function(e){e.classList.remove('on')});
    if(S.act){
      var pg=root.querySelector('.pg.'+S.act.side);
      if(pg){var l=pg.querySelectorAll('.line')[S.act.i]; if(l) l.classList.add('on')}
    }
  });
}
function refreshLens(){
  glass.innerHTML='';
  var c=bookwrap.cloneNode(true);
  c.removeAttribute('id');
  c.querySelectorAll('[id]').forEach(function(e){e.removeAttribute('id')});
  var lf=c.querySelector('.leaf'); if(lf) lf.remove();
  c.style.cssText='position:absolute;left:0;top:0;width:'+BW+'px;height:'+BH+'px;transform-origin:0 0;filter:none';
  glass.appendChild(c); S.clone=c; markActive();
}
function buildSeq(){
  S.seq=[]; S.cur=0; S.el=0; S.actCur=-1; S.act=null;
  [['L',S.pages[2*S.spread]],['R',S.pages[2*S.spread+1]]].forEach(function(a){
    if(!a[1]) return;
    a[1].lines.forEach(function(l,i){S.seq.push({side:a[0],i:i,w:l.w,dur:Math.max(2.2,l.text.trim().length*READ)})});
  });
  markActive();
}

/* ---------- листание ---------- */
var EASE={
  io:function(t){return t<.5?2*t*t:1-Math.pow(-2*t+2,2)/2},
  slow:function(t){return t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2},
  snap:function(t){return 1-Math.pow(1-t,3)},
  lazy:function(t){return t*t*(3-2*t)},
  hang:function(t){            /* приподнял, подержал в воздухе, перекинул */
    var sm=function(x){x=Math.max(0,Math.min(1,x));return x*x*(3-2*x)};
    return .36*sm(t/.3)+.1*sm((t-.3)/.3)+.54*sm((t-.55)/.45);
  },
  back:function(t){            /* слегка перелетает и оседает */
    var c=1.2,x=t-1; return Math.min(1.03,1+(c+1)*x*x*x+c*x*x);
  }
};
function mkParams(force){
  var ease=pick(['io','slow','snap','lazy','hang','back','io']);
  var pose=force||pick(['pinch','pinch','palm','two']);
  return {ease:ease,pose:pose,dur:rnd(1150,2300)*(ease==='hang'?1.25:1),
    lag:rnd(-12,40),k:rnd(1,2.4),wave:Math.random()<.5?rnd(1,8):0,waves:pick([1,1.5,2,2.5]),ph:rnd(0,6.28)};
}
function buildLeaf(frontHTML,backHTML){
  var leaf=document.createElement('div'); leaf.className='leaf';
  leaf.style.left=X0R+'px'; leaf.style.top=Y0+'px';
  var sw=PW/NS, parent=leaf, strips=[];
  for(var i=0;i<NS;i++){
    var s=document.createElement('div'); s.className='strip';
    s.style.left=(i?sw:0)+'px'; s.style.width=(sw+(i<NS-1?.8:0))+'px';
    s.innerHTML='<div class="face f"><div class="pg R" style="left:'+(-i*sw)+'px;top:0">'+frontHTML+'</div><i class="sh"></i></div>'+
                '<div class="face b"><div class="pg L" style="left:'+(-(PW-(i+1)*sw))+'px;top:0">'+backHTML+'</div><i class="sh"></i></div>';
    parent.appendChild(s); parent=s;
    strips.push({el:s,fs:s.querySelector('.f .sh'),bs:s.querySelector('.b .sh')});
  }
  return {el:leaf,strips:strips};
}
/* накопленные углы полос для прогресса e (0..1) */
function angles(P,e){
  var env=Math.sin(Math.PI*Math.min(1,Math.max(0,e))), out=[], th=180*e;
  for(var i=0;i<NS;i++){
    var s=i/(NS-1);
    var b=env*(-P.lag*Math.pow(s,P.k)+P.wave*s*Math.sin(P.waves*Math.PI*s+P.ph));
    out.push(Math.max(-4,Math.min(184,th+b)));
  }
  return out;
}
function applyAngles(L,phis){
  var prev=0;
  for(var i=0;i<NS;i++){
    var d=phis[i]-prev; prev=phis[i];
    var st=L.strips[i];
    st.el.style.transform='rotateY('+(-d).toFixed(2)+'deg)';
    var sn=Math.sin(phis[i]*Math.PI/180), sh=(.34*Math.abs(sn)).toFixed(3);
    st.fs.style.opacity=sh; st.bs.style.opacity=sh;
  }
}
/* где на экране точка листа (доля ширины sa, высоты va) с учётом перспективы */
function track(phis,sa,va){
  var sw=PW/NS, x=0, z=0, n=sa*NS;
  for(var i=0;i<NS;i++){
    var f=Math.min(1,Math.max(0,n-i)), r=phis[i]*Math.PI/180;
    x+=sw*f*Math.cos(r); z+=sw*f*Math.sin(r);
  }
  var X=X0R+x, Y=Y0+va*PH, ox=BW/2, oy=BH/2, k=1600/(1600-z);
  return {x:BX+ox+(X-ox)*k, y:BY+oy+(Y-oy)*k};
}
function lerp(a,b,t){return a+(b-a)*t}
function placeHand(h,pt){
  var ang=Math.atan2(ARMY-pt.y,ARMX-pt.x)*180/Math.PI;
  h.el.style.transform='translate('+pt.x.toFixed(1)+'px,'+pt.y.toFixed(1)+'px) rotate('+(ang-h.ba).toFixed(2)+'deg)';
}
function away(pt,dist){
  var dx=ARMX-pt.x, dy=ARMY-pt.y, l=Math.hypot(dx,dy);
  return {x:pt.x+dx/l*dist, y:pt.y+dy/l*dist};
}

/* правый лист переворачивается через корешок и ложится на левую страницу; руку и характер листания выбираем случайно */
function flipTo(idx,force){
  if(S.flipping) return;
  S.flipping=true; lens.style.opacity=0; S.act=null; markActive();
  var cur=S.spread, P=mkParams(force), H=HANDS[P.pose], ez=EASE[P.ease];
  var nLtext=pageHTML(S.pages[2*idx],'L',2*idx+1,false), nRtext=pageHTML(S.pages[2*idx+1],'R',2*idx+2,false);
  var L=buildLeaf(pageHTML(S.pages[2*cur+1],'R',2*cur+2,true),pageHTML(S.pages[2*idx],'L',2*idx+1,true));
  spread.appendChild(L.el);
  applyAngles(L,angles(P,0));
  pR.innerHTML=nRtext;
  setStack(idx,true);
  var TIN=700, D=P.dur, TOUT=650, t0=performance.now(), landed=false;
  var p0=track(angles(P,0),H.s,H.v), p1=track(angles(P,1),H.s,H.v);
  H.el.style.display='block';
  (function frame(now){
    var t=now-t0, pt;
    if(t<TIN){
      var u=EASE.snap(t/TIN); pt=away(p0,520); pt={x:lerp(pt.x,p0.x,u),y:lerp(pt.y,p0.y,u)};
    } else if(t<TIN+D){
      var e=ez((t-TIN)/D), phis=angles(P,e); applyAngles(L,phis); pt=track(phis,H.s,H.v);
    } else {
      if(!landed){
        landed=true; applyAngles(L,angles(P,1)); pL.innerHTML=nLtext; L.el.remove(); S.spread=idx; buildSeq(); refreshLens();
      }
      var u2=Math.min(1,(t-TIN-D)/TOUT); u2=u2*u2; var f=away(p1,520); pt={x:lerp(p1.x,f.x,u2),y:lerp(p1.y,f.y,u2)};
    }
    placeHand(H,pt);
    if(t<TIN+D+TOUT) requestAnimationFrame(frame);
    else {H.el.style.display='none'; S.flipping=false; lens.style.opacity=1}
  })(t0);
}
function nextSpread(){flipTo((S.spread+1)%spreadsCount())}

function setStory(text){
  S.pages=paginate(text); S.spread=0; renderSpread(0); buildSeq(); refreshLens();
  S.lx=S.tx=TXL; S.ly=S.ty=TOPY+LH/2; S.hold=0;
}

var last=performance.now();
function tick(now){
  var dt=Math.min(.1,(now-last)/1000); last=now;
  if(S.playing && !S.flipping){
    if(S.hold>0){S.hold-=dt; if(S.hold<=0){S.hold=0; nextSpread()}}
    else if(S.seq.length){
      var ln=S.seq[S.cur];
      if(S.actCur!==S.cur){S.actCur=S.cur; S.act={side:ln.side,i:ln.i}; markActive()}
      S.el+=dt; var t=Math.min(1,S.el/ln.dur);
      S.tx=(ln.side==='L'?X0L+TLL:X0R+TLR)+t*ln.w; S.ty=TOPY+LH*ln.i+LH/2;
      if(S.el>=ln.dur){S.cur++; S.el=0; if(S.cur>=S.seq.length) S.hold=1.2}
    } else S.hold=1.2;
  }
  var k=1-Math.exp(-dt*3.5);
  S.lx+=(S.tx-S.lx)*k; S.ly+=(S.ty-S.ly)*k;
  var dx=S.lx+Math.sin(now/900)*.8, dy=S.ly+Math.cos(now/700)*.8;
  lens.style.transform='translate('+(BX+dx-HCX)+'px,'+(BY+dy-HCY)+'px)';
  var cx=BX+dx, cy=BY+dy;
  arm.style.transform='rotate('+(Math.atan2(ARMY-cy,ARMX-cx)*180/Math.PI).toFixed(2)+'deg)';
  if(S.clone) S.clone.style.transform='translate('+(RCL-Z*dx)+'px,'+(RCL-Z*dy)+'px) scale('+Z+')';
  requestAnimationFrame(tick);
}

var fl=1;
setInterval(function(){
  fl=fl*.4+(.78+Math.random()*.22)*.6;
  stage.style.setProperty('--f',fl.toFixed(2));
  stage.style.setProperty('--sk',((Math.random()*6-3).toFixed(1))+'deg');
},90);

/* плашки показывают только последние 2 записи, без заголовков */
function addTo(box,build){
  var d=document.createElement('div'); d.className='m'; build(d); box.appendChild(d);
  while(box.children.length>2) box.removeChild(box.firstChild);
}
function addChat(name,text){
  addTo(chat,function(d){var b=document.createElement('b'); b.textContent=String(name).slice(0,24)+': '; d.appendChild(b); d.appendChild(document.createTextNode(String(text).slice(0,90)))});
}
function addGift(name,gift){
  addTo(gifts,function(d){var b=document.createElement('b'); b.textContent=String(name).slice(0,20); d.appendChild(b); d.appendChild(document.createTextNode(' · '+String(gift).slice(0,24)))});
  giftsPlaque.classList.remove('flash'); void giftsPlaque.offsetWidth; giftsPlaque.classList.add('flash');
}

var STORY=[
"Старый дом на краю деревни пустовал уже тридцать лет. Говорили, что по ночам в окнах мерцает свеча, хотя электричества там давно нет.",
"Мы с братом поспорили, что дойдём до крыльца и вернёмся. Он шёл впереди и всё время оглядывался, а я старался смотреть только под ноги.",
"Дверь была приоткрыта. Из щели тянуло холодом и воском. На столе в прихожей лежала огромная книга, раскрытая посередине, и страницы в ней шевелились сами.",
"Я наклонился, чтобы прочесть первую строку, и увидел там своё имя. Чуть ниже было написано: «Не оборачивайся». Брат стоял позади и молчал. А ведь он ушёл ещё минуту назад.",
"Свеча на столе вспыхнула ярче, и я услышал, как кто-то медленно перелистывает страницу.",
"Я хотел бежать, но ноги будто вросли в доски. Страница за страницей книга писала о том, что происходило со мной сейчас: как я стою, как дрожит свет, как за спиной скрипит пол.",
"Тогда я понял, что читать нужно было не её. Нужно было слушать. Потому что голос, который диктовал строки, звучал совсем рядом, и принадлежал он вовсе не брату.",
"Утром нас нашли у калитки. Брат ничего не помнил. А в доме, говорят, на столе до сих пор лежит открытая книга, и в ней появилась новая запись."
].join('\n');

window.Book={addChat:addChat,addGift:addGift,setStory:setStory,
  play:function(){S.playing=true;sync()},pause:function(){S.playing=false;sync()},
  flip:function(pose){flipTo((S.spread+1)%spreadsCount(),pose)}};

var bPlay=document.getElementById('bPlay');
function sync(){bPlay.textContent=S.playing?'❚❚':'▶'}
bPlay.onclick=function(){S.playing=!S.playing;sync()};
document.getElementById('bNext').onclick=function(){nextSpread()};
document.getElementById('bPrev').onclick=function(){
  if(S.flipping) return;
  S.spread=(S.spread-1+spreadsCount())%spreadsCount(); renderSpread(S.spread); buildSeq(); refreshLens();
  S.lx=S.tx=TXL; S.ly=S.ty=TOPY+LH/2; S.hold=0;
};
var gi=0, GN=['Роза','Сердце','Корона','Лев'], PN=['Алёна','Мрак_77','Ксюша','Витя'];
document.getElementById('bGift').onclick=function(){addGift(PN[gi%4],GN[gi%4]+' ×'+(1+gi%5)); gi++};

if(q.get('demo')!=='0'){
  var NM=['Алёна','Мрак_77','Тёмный_Лес','Ксюша','Витя','Ночной_Гость'],
      TX=['Привет всем!','Страшно уже','Свет не выключай','Читай дальше','Откуда смотрите?','Мурашки','Первый раз на эфире'];
  (function loopChat(){addChat(NM[Math.random()*NM.length|0],TX[Math.random()*TX.length|0]); setTimeout(loopChat,5000+Math.random()*4000)})();
  (function loopGift(){setTimeout(function(){addGift(NM[Math.random()*NM.length|0],GN[Math.random()*4|0]+' ×'+(1+(Math.random()*5|0))); loopGift()},15000+Math.random()*10000)})();
  addChat('Алёна','Привет!'); addChat('Мрак_77','Начинаем?');
  addGift('Витя','Роза ×3');
}

Promise.race([document.fonts.load('15px Lora'),new Promise(function(r){setTimeout(r,2500)})]).then(function(){
  setStory(STORY); requestAnimationFrame(function(t){last=t; tick(t)});
});
})();
